const container = document.getElementById("mynetwork");

const data = {
    nodes: nodes,
    edges: edges
};

const options = {
    interaction: {
        hover: true,
        tooltipDelay: 150,
        navigationButtons: true,
        keyboard: true,
        multiselect: true,
        dragNodes: true,
        dragView: true,
        zoomView: true
    },

    nodes: {
        shape: "dot",
        fixed: false,
        borderWidth: 1.5,
        font: {
            size: 15,
            face: "Arial",
            strokeWidth: 4,
            strokeColor: "white"
        }
    },

    edges: {
        arrows: {
            to: {
                enabled: true,
                scaleFactor: 0.8
            }
        },
        selectionWidth: 2,
        hoverWidth: 1.5
    },

    physics: {
        enabled: true,
        solver: "barnesHut",
        barnesHut: {
            gravitationalConstant: -9000,
            centralGravity: 0.12,
            springLength: 230,
            springConstant: 0.025,
            damping: 0.18,
            avoidOverlap: 0.7
        },
        stabilization: {
            enabled: true,
            iterations: 1500,
            updateInterval: 50
        }
    },

    layout: {
        improvedLayout: false
    }
};

const network = new vis.Network(container, data, options);

// Once the layout settles, stop physics.
// All nodes can then be dragged and stay where placed.
network.once("stabilizationIterationsDone", function () {
    network.setOptions({
        physics: false,
        nodes: {
            fixed: false
        },
        interaction: {
            dragNodes: true,
            dragView: true,
            zoomView: true
        }
    });

    network.fit({
        animation: {
            duration: 500
        }
    });
});
</script>
